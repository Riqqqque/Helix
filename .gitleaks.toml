title = "Helix Gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public localStorage namespace, not a credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^helix\.operations\.v1$''']
paths = ['''^frontend/src/operation-continuity\.ts$''']

[[allowlists]]
description = "Generated dependencies, build output, Git internals, and local runtime data"
paths = [
    '''^target([/\\]|$)''',
    '''^frontend[/\\]node_modules([/\\]|$)''',
    '''^frontend[/\\]dist([/\\]|$)''',
    '''^\.git([/\\]|$)''',
    '''^\.helix-data([/\\]|$)''',
]
