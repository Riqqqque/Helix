title = "Helix Gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, build output, Git internals, and local runtime data"
paths = [
    '''^target([/\\]|$)''',
    '''^frontend[/\\]node_modules([/\\]|$)''',
    '''^frontend[/\\]dist([/\\]|$)''',
    '''^\.git([/\\]|$)''',
    '''^\.helix-data([/\\]|$)''',
]
