name: Helix

# The CodeQL workflow passes this file as config-file. GitHub default setup
# does not load it, so keep default setup disabled while this workflow runs.
#
# rust/path-injection treats operator config, CLI data dirs, and environment
# paths as untrusted. Helix is a local-first control plane: those paths are
# trusted, root-owned configuration. HTTP file access is sandboxed inside
# helix-privd after canonicalize/managed-root checks, and that cross-process
# flow is not what this query currently reports.
#
# The Rust job also sets CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES=-test
# so #[cfg(test)] fixtures are not extracted. Rust CodeQL has no working
# inline suppression, and it does not classify cfg(test) as test code.
query-filters:
  - exclude:
      id: rust/path-injection
