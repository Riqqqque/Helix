<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Helix</title>
  <desc id="desc">Helix local-first Linux host and game-server dashboard.</desc>
  <defs>
    <radialGradient id="background" cx="82%" cy="4%" r="105%">
      <stop offset="0" stop-color="#1b3044"/>
      <stop offset="0.5" stop-color="#0d1725"/>
      <stop offset="1" stop-color="#080c14"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#71e6a3" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#71e6a3" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#72c9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1090" cy="52" r="310" fill="#72c9ff" opacity="0.035"/>
  <circle cx="1040" cy="610" r="360" fill="#71e6a3" opacity="0.025"/>
  <rect x="48" y="48" width="1184" height="544" rx="42" fill="none" stroke="#bed0e2" stroke-opacity="0.13" stroke-width="2"/>
  <rect x="104" y="118" width="176" height="176" rx="44" fill="#101724" stroke="#bed0e2" stroke-opacity="0.15" stroke-width="2"/>

  <g transform="translate(104 118) rotate(-8 88 88)">
    <rect x="70" y="31" width="36" height="114" rx="18" transform="rotate(43 88 88)" fill="#71e6a3" filter="url(#glow)"/>
    <rect x="70" y="31" width="36" height="114" rx="18" transform="rotate(-43 88 88)" fill="#101724" stroke="#71e6a3" stroke-width="4"/>
    <circle cx="54" cy="54" r="6" fill="#a0f0c1"/>
    <circle cx="122" cy="122" r="6" fill="#a0f0c1"/>
  </g>

  <text x="334" y="188" fill="#8d99aa" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="7">LOCAL-FIRST LINUX SERVER DASHBOARD</text>
  <text x="326" y="294" fill="#f5f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="13">HELIX</text>
  <text x="110" y="394" fill="#c8d0dc" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400">Private host and game-server manager.</text>
  <text x="110" y="438" fill="#c8d0dc" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400">Modular dashboard. Real Linux controls.</text>

  <rect x="110" y="500" width="210" height="56" rx="28" fill="#71e6a3" fill-opacity="0.10" stroke="#71e6a3" stroke-opacity="0.35"/>
  <rect x="338" y="500" width="190" height="56" rx="28" fill="#71e6a3" fill-opacity="0.10" stroke="#71e6a3" stroke-opacity="0.35"/>
  <rect x="546" y="500" width="252" height="56" rx="28" fill="#71e6a3" fill-opacity="0.10" stroke="#71e6a3" stroke-opacity="0.35"/>
  <rect x="816" y="500" width="230" height="56" rx="28" fill="#71e6a3" fill-opacity="0.10" stroke="#71e6a3" stroke-opacity="0.35"/>
  <text x="215" y="537" text-anchor="middle" fill="#a0f0c1" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">PRIVATE ALPHA</text>
  <text x="433" y="537" text-anchor="middle" fill="#a0f0c1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PRIVATE NETWORK</text>
  <text x="672" y="537" text-anchor="middle" fill="#a0f0c1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">NATIVE SERVERS</text>
  <text x="931" y="537" text-anchor="middle" fill="#a0f0c1" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">SOURCE BUILD</text>
  <rect x="104" y="472" width="1072" height="2" fill="url(#line)"/>
</svg>
